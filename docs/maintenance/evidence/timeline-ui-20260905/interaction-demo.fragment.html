 sourceHits(draft).forEach((h,i)=>{line(svg,x(h.f),43,x(h.f),78,h.cancelled?'var(--sp-bad)':'var(--sp-text)',{'stroke-width':2,'stroke-dasharray':h.cancelled?'3 3':''});if(!narrow||i!==1)txt(svg,x(h.f),91,(i+1)+(h.cancelled?' ×':''),{'text-anchor':'middle'})});
 if(!state.dragging)s.ports.forEach(p=>{if(!narrow||p.id===draft.port)portButton(controls,p,x(p.f+state.shift),101)});
 else controls.querySelectorAll('[data-anchor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.anchor===draft.port)));
 const time=at(draft),to=Math.min(end,time+kind(draft).duration),blocked=!!validity(draft);
 rect(svg,x(time),151,x(to)-x(time),27,blocked?'var(--sp-panel)':'var(--sp-soft)',{rx:3,stroke:blocked?'var(--sp-bad)':'var(--sp-accent)','stroke-dasharray':'4 3'});
 line(svg,x(time),31,x(time),240,blocked?'var(--sp-bad)':'var(--sp-accent)',{'stroke-dasharray':'3 3'});
 txt(svg,clamp(x(time),left,width-92),145,`${f(time)} · ${blocked?'不可接':'输入预览'}`,{style:blocked?'fill:var(--sp-bad)':'fill:var(--sp-accent)'});
 const anchor=x(port(draft).f+state.shift);line(svg,anchor,132,x(time),132,'var(--sp-accent)',{'stroke-width':2});
 if(time+kind(draft).duration>end)txt(svg,width-right,194,'继续 →',{'text-anchor':'end',style:'fill:var(--sp-muted)'});
 const tail=tails(draft).filter(n=>n>=start&&n<=end);
 if(state.showTails&&tail.length){rect(svg,x(tail[0]),216,x(Math.min(end,tails(draft).at(-1)))-x(tail[0]),12,'var(--sp-tail-bg)',{rx:3});tail.forEach(n=>line(svg,x(n),214,x(n),230,'var(--sp-tail)',{'stroke-width':1.5}));if(tails(draft).at(-1)>end)txt(svg,width-right,249,'拖尾继续 →',{'text-anchor':'end',style:'fill:var(--sp-tail)'})}
 if(state.scene==='tangtang'&&state.shift===0&&time===352){line(svg,x(354),178,x(359),214,'var(--sp-accent)',{'stroke-dasharray':'2 3'});txt(svg,left,249,'落地命中 F354 → 汤汤巨浪 F359',{style:'fill:var(--sp-muted)'})}
 $('[data-detail-title]').textContent=`${s.actor} · ${s.source} / 局部轨道`;
 $('[data-ports]').replaceChildren();s.ports.forEach(p=>{const blocked=!!validity({...draft,port:p.id,offset:0});const b=setButton($('[data-ports]'),'◇ '+p.label,{'data-pick':p.id,'aria-pressed':String(p.id===draft.port),'data-blocked':String(blocked)},()=>{state.draft.port=p.id;state.draft.offset=0;render();message('落点已选；用加减键微调。')});const t=document.createElement('span');t.textContent=f(p.f+state.shift);b.append(t)});
 if(document.activeElement!==$('[data-offset]'))$('[data-offset]').value=draft.offset;
 $('[data-frame]').textContent=f(time)+' · '+(draft.offset/30).toFixed(2)+'秒偏移';$('[data-apply]').disabled=blocked;
 $('[data-outcome]').replaceChildren();outcome(draft).forEach(o=>{const span=document.createElement('span');span.dataset.tone=o.tone;span.textContent=o.text;$('[data-outcome]').append(span)});
 root.dataset.previewFrame=time;
}
function render(){
 root.dataset.open=String(state.open);$('[data-detail]').hidden=!state.open;$('[data-open]').textContent=state.open?'收回谱面':'展开卡点';$('[data-scene]').value=state.scene;$('[data-undo]').disabled=!state.history.length;
 $('[data-provenance]').textContent=scene().basis;
 const pal=$('[data-palette]');pal.replaceChildren();const lead=document.createElement('small');lead.textContent='拖入 / 点选后继';pal.append(lead);
 scene().kinds.forEach(k=>{const b=setButton(pal,k.label,{'data-drag-kind':k.id,'aria-pressed':String(state.draft.kind===k.id)},()=>{state.draft.kind=k.id;state.open=true;render();message('选择菱形，或在两个命中之间拖放。')});b.draggable=true});
 renderOverview();renderLocal();
}
function apply(){const reason=validity(state.draft);if(reason){message(reason);return}stash();state.plan=clone(state.draft);render();message('已应用：'+relation(state.plan)+'。可收回谱面；撤销可恢复。')}
function fold(){state.open=false;state.draft=clone(state.plan);render();message('已收回；接续关系保留在按钮下方。')}
function open(){state.open=true;state.draft=clone(state.plan);render()}
function nudge(delta){state.draft.offset=clamp(state.draft.offset+delta,0,180);renderLocal()}
function chooseDrop(e){
 const el=e.target instanceof Element?e.target:null,anchor=el?.closest('[data-anchor]');
 if(anchor){state.draft.port=anchor.dataset.anchor;state.draft.offset=0;return true}
 const local=el?.closest('.sp-detail-plot');
 if(local&&localMap){const rect=local.getBoundingClientRect(),m=localMap,frame=Math.round(m.start+(clamp(e.clientX-rect.left,m.left,m.width-m.right)-m.left)/(m.width-m.left-m.right)*(m.end-m.start));
  const nearest=scene().ports.reduce((a,b)=>Math.abs(m.x(b.f+state.shift)-(e.clientX-rect.left))<Math.abs(m.x(a.f+state.shift)-(e.clientX-rect.left))?b:a);
  const snapped=Math.abs(m.x(nearest.f+state.shift)-(e.clientX-rect.left))<=9;
  const p=snapped?nearest:[...scene().ports].reverse().find(p=>p.f+state.shift<=frame)||scene().ports[0];
  state.draft.port=p.id;state.draft.offset=clamp(snapped?0:frame-(p.f+state.shift),0,180);return true;
 }
 return !!el?.closest('[data-drop-source]');
}
root.addEventListener('dragstart',e=>{const b=e.target.closest('[data-drag-kind]');if(!b)return;state.draft.kind=b.dataset.dragKind;e.dataTransfer.setData('text/plain',b.dataset.dragKind);e.dataTransfer.effectAllowed='copy';
 // Reveal only below the unchanged compact board; never move the grabbed button.
 state.open=true;$('[data-detail]').hidden=false;$('[data-open]').textContent='收回谱面';root.dataset.open='true';renderLocal();state.dragging=true;dragBounds={start:localMap.start,end:localMap.end};message('拖到菱形可吸附；拖进两击之间可保留帧间隔。');
});
root.addEventListener('dragover',e=>{if(!state.dragging)return;if(chooseDrop(e)){e.preventDefault();e.dataTransfer.dropEffect=validity(state.draft)?'none':'copy';renderLocal()}});
root.addEventListener('drop',e=>{if(!state.dragging||!chooseDrop(e))return;e.preventDefault();state.dragging=false;dragBounds=null;apply()});
root.addEventListener('dragend',()=>{state.dragging=false;dragBounds=null});
$('[data-scene]').onchange=e=>{stash();state.scene=e.target.value;state.shift=0;state.plan=clone(scene().default);state.draft=clone(state.plan);state.open=false;render();message('已切换场景。记录片段的编辑只预览排程，不重算伤害。')};
$('[data-open]').onclick=()=>state.open?fold():open();$('[data-fold]').onclick=fold;$('[data-relation]').onclick=open;$('[data-apply]').onclick=apply;
$('[data-shift]').onclick=()=>{stash();state.shift+=6;state.draft=clone(state.plan);render();message('源动作后移 6 帧，后继按保存的接点关系跟随。')};
$('[data-undo]').onclick=()=>{const past=state.history.pop();if(!past)return;state.scene=past.scene;state.shift=past.shift;state.plan=past.plan;state.draft=clone(state.plan);render();message('已撤销上一次排轴修改。')};
$('[data-offset]').oninput=e=>{const n=Number(e.target.value);if(!Number.isInteger(n)||n<0||n>180){$('[data-apply]').disabled=true;message('偏移需为 0–180 的整数帧。');return}state.draft.offset=n;renderLocal()};
root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>nudge(Number(b.dataset.step)));
root.addEventListener('keydown',e=>{if(e.key==='Escape'){state.dragging=false;dragBounds=null;fold()}if(e.target.matches('[data-offset]')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();nudge(e.key==='ArrowLeft'?-1:1)}});
const observer=new ResizeObserver(()=>{if(!state.dragging){renderOverview();renderLocal()}});observer.observe($('.sp-board'));
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'showTails',{label:'显示持续效果带'});}
})();
</script>
